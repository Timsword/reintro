<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reintro</title>
<meta name="description" content="Food reintroduction diary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reintro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f5; --card:#ffffff; --ink:#1d2421; --muted:#68736d; --line:#e2e6e3;
  --chip:#eef1ef; --accent:#2f7d62; --accent-ink:#ffffff; --accent-soft:#e2f0e9;
  --ok:#3b9a6b; --ok-soft:#d9efe3; --warn:#c98a1c; --warn-soft:#f7ead0;
  --bad:#cc5146; --bad-soft:#f6dcd8; --none:#d3d8d5; --shadow:0 1px 2px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121614; --card:#1b201e; --ink:#e5eae7; --muted:#97a29c; --line:#2c3330;
    --chip:#252c29; --accent:#5cc49a; --accent-ink:#0b1712; --accent-soft:#1e3329;
    --ok:#5cc49a; --ok-soft:#1d3a2c; --warn:#e2b04f; --warn-soft:#3d321b;
    --bad:#ec7b70; --bad-soft:#442523; --none:#38403c; --shadow:none;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid transparent}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.01em}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.pill.saved{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:560px;margin:0 auto;padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:650;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px}
.muted{color:var(--muted)} .small{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--chip);font-size:15px;white-space:nowrap;flex:0 0 auto;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.add{border-style:dashed;background:transparent}
.chip .x{margin-left:6px;opacity:.6}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);border-radius:12px;padding:4px;margin-bottom:10px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-size:14px;min-height:40px}
.seg button.sel{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.seg button .n{display:block;font-size:11px;color:var(--muted);font-weight:400}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
textarea.field{resize:vertical;min-height:64px}
label.lab{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.btn{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--chip);font-size:15px;font-weight:550}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1;flex:0 0 auto}
.x-btn{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:20px;flex:0 0 auto}
.datebar{display:flex;align-items:center;gap:8px;margin-top:8px}
.datepick{flex:1;position:relative;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:600}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.datepick .sub{font-weight:400;color:var(--muted);margin-left:6px;font-size:14px}
.link{border:0;background:none;color:var(--accent);padding:6px 0;font-size:14px}
.items{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:4px 4px 4px 12px}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gram{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px}
.gram input{width:72px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);text-align:right;min-height:40px}
.timein{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:40px;min-width:96px}
.rate{padding:10px 0;border-top:1px solid var(--line)}
.rate:first-of-type{border-top:0;padding-top:0}
.rate .lbl{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale button{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:15px}
.scale button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.scale.sev button.sel.v3,.scale.sev button.sel.v4,.scale.sev button.sel.v5{background:var(--bad);border-color:var(--bad);color:#fff}
.scale.sev button.sel.v2{background:var(--warn);border-color:var(--warn);color:#fff}
.bristol{display:flex;flex-direction:column;gap:6px}
.bristol button{display:flex;align-items:center;gap:12px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:6px 10px;text-align:left;font-size:14px}
.bnum{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto;color:#fff}
.b-ok{background:var(--ok)} .b-warn{background:var(--warn)} .b-bad{background:var(--bad)}
.stools{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.st-progress{background:var(--accent-soft);color:var(--accent)}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-reaction{background:var(--bad-soft);color:var(--bad)}
.st-retest{background:var(--warn-soft);color:var(--warn)}
.banner{border-radius:14px;padding:12px 14px;margin:12px 0;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--warn-soft)} .banner.info{background:var(--accent-soft)}
.banner .btn{min-height:36px;padding:6px 12px;font-size:14px;flex:0 0 auto}
details.test{border-top:1px solid var(--line)}
details.test:first-of-type{border-top:0}
details.test summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 0;min-height:48px;cursor:pointer}
details.test summary::-webkit-details-marker{display:none}
details.test summary .tname{flex:1;font-size:16px}
details.test summary::after{content:"›";color:var(--muted);font-size:20px;transition:transform .15s}
details.test[open] summary::after{transform:rotate(90deg)}
.tbody{padding:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal button{aspect-ratio:1;border-radius:10px;border:0;background:var(--chip);font-size:14px;position:relative;padding:0}
.cal button.empty{background:transparent}
.cal button.lv-ok{background:var(--ok-soft);color:var(--ok);font-weight:650}
.cal button.lv-warn{background:var(--warn-soft);color:var(--warn);font-weight:650}
.cal button.lv-bad{background:var(--bad-soft);color:var(--bad);font-weight:650}
.cal button.lv-log{background:var(--accent-soft)}
.cal button.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal button .dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hlist button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0}
.hlist button:first-child{border-top:0}
.hlist .d{font-weight:600}
.hlist .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
pre.preview{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);border-radius:10px;padding:10px;max-height:320px;overflow:auto;margin:10px 0 0}
.status{font-size:14px;margin:4px 0 8px}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)} .status.warn{color:var(--warn)}
ol.steps{padding-left:20px;margin:8px 0;font-size:14px;color:var(--muted)}
ol.steps li{margin:4px 0}
a{color:var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;color:var(--muted);min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:550}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);transition:all .2s;z-index:20;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad);color:#fff}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.streak{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg)}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">Reintro</div><button id="pill" class="pill" data-act="tab" data-tab="export">…</button></div></header>
<main id="view"><section class="card" id="noapp"><h2>Reintro isn't running</h2>
  <div class="small muted">The app's JavaScript didn't start. This happens in file previews that block scripts.
  Open it through a web address instead (the hosted URL, or a local server such as <code>python -m http.server</code>).</div></section></main>
<nav class="tabs"><div class="tabs-in">
  <button class="tab" data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Today</button>
  <button class="tab" data-act="tab" data-tab="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>Tests</button>
  <button class="tab" data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>History</button>
  <button class="tab" data-act="tab" data-tab="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>Export</button>
</div></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
window.addEventListener('error', e => {
  const v = document.getElementById('view');
  if (v && !v.dataset.ok) v.innerHTML = '<section class="card"><h2>Something went wrong</h2><div class="small muted">' +
    String(e.message || e.error || 'Unknown error').replace(/[<>&]/g, '') + '</div><div class="small muted" style="margin-top:8px">Your saved data is untouched. Try reloading.</div></section>';
});
/* ---------- constants ---------- */
const DATA_KEY = 'reintro.data.v1';
const CFG_KEY = 'reintro.cfg.v1';
const MEALS = [['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snack']];
const SYMPTOMS = [['bloating','Bloating'],['gas','Gas'],['pain','Abdominal pain'],['cramps','Cramps'],['nausea','Nausea'],
  ['reflux','Reflux'],['fatigue','Fatigue'],['skin','Skin issues'],['headache','Headache']];
const PHASES = [['d1','Day 1 · small'],['d2','Day 2 · full'],['obs','Observe']];
const PHASE_LONG = {d1:'Day 1 (small portion)', d2:'Day 2 (full portion)', obs:'Observe (no test food)'};
const STATUSES = [['untested','Not tested'],['progress','In progress'],['ok','Tolerated'],['reaction','Reaction'],['retest','Retest later']];
const STATUS_LABEL = Object.fromEntries(STATUSES);
const BRISTOL = [null,'Separate hard lumps','Lumpy, sausage-shaped','Sausage with cracks','Smooth, soft sausage',
  'Soft blobs, clear edges','Mushy, ragged edges','Watery, no solid pieces'];
const BRISTOL_CLASS = b => (b===3||b===4) ? 'b-ok' : (b===7||b===1) ? 'b-bad' : 'b-warn';
const BRISTOL_SCORE = {1:4,2:2,3:0,4:0,5:2,6:4,7:5};
const BACKUP_WARN_DAYS = 3;

/* ---------- version: bump APP_VERSION for every release (MAJOR.MINOR.PATCH). It is the single source:
   the offline cache, the update check and the Version card all read it. Add a CHANGELOG line too. ---------- */
const APP_VERSION = '0.3.1';
const CHANGELOG = [
  ['0.3.1', 'Version card with one-tap updates; updates now arrive on the next open.'],
  ['0.3.0', 'Search-as-you-type for foods and drinks, top 8 suggestions, long-press to hide.'],
  ['0.2.0', 'Automatic reintroduction tracking, “Same as last meal”, compact symptoms, “no BM” default, drink serving sizes.'],
  ['0.1.0', 'First version.'],
];
const cmpVer = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < 3; i++){ if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) > (y[i]||0) ? 1 : -1; } return 0; };

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const fmtDate = (s, o={weekday:'short', day:'numeric', month:'short'}) => new Date(s+'T12:00:00').toLocaleDateString(undefined, o);
const nowTime = () => new Date().toTimeString().slice(0,5);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const lc = s => String(s||'').trim().toLowerCase();
const uniqCI = arr => { const seen = new Set(); return arr.filter(x => { const k = lc(x); if (!k || seen.has(k)) return false; seen.add(k); return true; }); };
function ago(ts){
  if (!ts) return 'never';
  const s = (Date.now()-ts)/1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60)+' min ago';
  if (s < 86400) return Math.floor(s/3600)+' h ago';
  const d = Math.floor(s/86400); return d+(d===1?' day ago':' days ago');
}
function lsGet(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
function setPath(o, path, val){ const ks = path.split('.'); for (let i=0;i<ks.length-1;i++) o = o[ks[i]]; o[ks[ks.length-1]] = val; }
const b64enc = s => { const b = new TextEncoder().encode(s); let bin=''; for (let i=0;i<b.length;i+=0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i+0x8000)); return btoa(bin); };
const b64dec = s => { const bin = atob(String(s).replace(/\s/g,'')); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); };

/* ---------- data model ---------- */
function blankDay(date){
  return { date, meals: Object.fromEntries(MEALS.map(([k]) => [k, {time:'', items:[]}])),
    test:{food:'', phase:''}, drinks:[], stools:[], noBM:false, sym:{}, otherSym:'',
    sleep:null, stress:null, meds:'', exercise:'', notes:'', updatedAt:0 };
}
function normDay(d, date){
  const b = blankDay(date);
  d = Object.assign(b, d || {});
  MEALS.forEach(([k]) => { d.meals[k] = Object.assign({time:'', items:[]}, d.meals[k] || {}); });
  d.test = Object.assign({food:'', phase:''}, d.test || {});
  d.sym = d.sym || {}; d.drinks = d.drinks || []; d.stools = d.stools || [];
  return d;
}
function normalize(data){
  const out = { app:'reintro', version:1, days:{}, tests:[], safeFoods:[], quickFoods:[], quickDrinks:[], listsUpdatedAt:0 };
  if (!data || typeof data !== 'object') return out;
  Object.entries(data.days || {}).forEach(([k, d]) => { out.days[k] = normDay(d, k); });
  out.tests = (data.tests || []).map(t => Object.assign({id:uid(), name:'', status:'untested', start:'', end:'', note:''}, t));
  out.safeFoods = data.safeFoods || [];
  out.quickFoods = data.quickFoods || [];
  out.quickDrinks = data.quickDrinks || ['Water','Powerade','Herbal tea','Coffee'];
  out.listsUpdatedAt = data.listsUpdatedAt || 0;
  return out;
}

/* Generic starting lists for a fresh install. No personal data here: the code is public.
   Timestamps are 0, so an imported file or a GitHub backup always wins a merge. */
function seedData(){
  const names = ['Pasta','Bread','Tomato','Garlic','Onion','Lactose-free mozzarella','Regular mozzarella','Parmigiano Reggiano','Pesto','Powerade'];
  return normalize({ days:{}, tests: names.map(n => ({id:uid(), name:n, status:'untested', start:'', end:'', note:''})),
    safeFoods:['Rice','Chicken','Meat','Zucchini','Carrots','Olive oil','Salt'], quickFoods:[], listsUpdatedAt:0 });
}

/* ---------- state ---------- */
let S = lsGet(DATA_KEY);
const firstRun = !S || !S.days;
S = firstRun ? seedData() : normalize(S);
const CFG_DEFAULT = { gh:{repo:'', path:'diary.json', token:'', auto:true}, lastSyncAt:0, lastFileBackupAt:0, dirty:false, lastGrams:{}, hideInstall:false };
let C = Object.assign({}, CFG_DEFAULT, lsGet(CFG_KEY) || {});
C.gh = Object.assign({}, CFG_DEFAULT.gh, C.gh || {});
C.lastGrams = C.lastGrams || {};
C.lastMl = C.lastMl || {};
C.hiddenChips = C.hiddenChips || [];

const ui = { tab:'today', date:today(), meal:defaultMeal(), histMonth:today().slice(0,7),
  exFrom:addDays(today(), -13), exTo:today(), openTests:new Set(), sync:'idle', syncErr:'', pendingImport:null, preview:false,
  moreSym:false, moreCtx:false, upd:{state:'idle'} };
const MAIN_SYM = ['gas', 'cramps'];

function defaultMeal(){ const h = new Date().getHours(); return h < 11 ? 'breakfast' : h < 15 ? 'lunch' : h < 18 ? 'snack' : 'dinner'; }

let persistTimer = null;
function persistNow(){
  clearTimeout(persistTimer);
  const ok = lsSet(DATA_KEY, S) && lsSet(CFG_KEY, C);
  if (!ok) toast('Could not save on this device (storage blocked or full). Export a backup now!', true);
  return ok;
}
function persistSoon(){ clearTimeout(persistTimer); persistTimer = setTimeout(persistNow, 300); }
function saveCfg(){ lsSet(CFG_KEY, C); }
if (firstRun) persistNow();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

function changed({rerender=true, lists=false} = {}){
  if (lists) S.listsUpdatedAt = Date.now();
  C.dirty = true;
  if (rerender) persistNow(); else persistSoon();
  flashSaved();
  scheduleSync();
  if (rerender) render();
}
const hasData = d => !!d && !d.deleted && d.updatedAt > 0;
const getDay = date => hasData(S.days[date]) ? S.days[date] : null;
function ensureDay(date){
  let d = S.days[date];
  if (!d || d.deleted){ d = blankDay(date); d.noBM = true; S.days[date] = d; }   // new days default to "no BM"
  return d;
}
function editDay(fn, opt){ const d = ensureDay(ui.date); fn(d); d.deleted = false; d.updatedAt = Date.now(); changed(opt); }

/* ---------- derived ---------- */
function quickFoods(d){
  const tested = S.tests.filter(t => t.status !== 'untested').map(t => t.name);
  return uniqCI([d && d.test.food, ...S.safeFoods, ...tested, ...S.quickFoods].filter(Boolean));
}
function foodsOf(d){
  const s = [];
  MEALS.forEach(([m]) => d.meals[m].items.forEach(i => i.name && s.push(i.name)));
  d.drinks.forEach(x => x.name && !/^water$/i.test(x.name.trim()) && s.push(x.name));
  return uniqCI(s);
}
function firstSeenMap(){
  const map = {};
  Object.keys(S.days).sort().forEach(k => { const d = S.days[k]; if (!hasData(d)) return;
    foodsOf(d).forEach(f => { const key = lc(f); if (!(key in map)) map[key] = k; }); });
  return map;
}
function newFoodsOn(d, fs){ const safe = new Set(S.safeFoods.map(lc)); return foodsOf(d).filter(f => !safe.has(lc(f)) && fs[lc(f)] === d.date); }
const isSafe = name => S.safeFoods.some(f => lc(f) === lc(name));
const testFor = key => S.tests.find(t => lc(t.name) === key);
const VERDICTS = [['ok','Tolerated'],['reaction','Reaction'],['retest','Retest']];
/* Every logged food/drink outside the base diet, with the days eaten and what happened in the
   window from the first day eaten until 2 days after the last (24–72 h delays). */
function reintroFoods(){
  const map = {};
  Object.keys(S.days).sort().forEach(k => { const d = S.days[k]; if (!hasData(d)) return;
    foodsOf(d).forEach(f => { if (isSafe(f)) return; const key = lc(f);
      const e = map[key] || (map[key] = {name:f, key, first:k, days:[]}); e.days.push(k); }); });
  const t = today();
  return Object.values(map).map(e => {
    e.last = e.days[e.days.length - 1];
    e.test = testFor(e.key);
    e.window = [];
    const end = addDays(e.last, 2) < t ? addDays(e.last, 2) : t;
    for (let k = e.first; k <= end && e.window.length < 120; k = addDays(k, 1)) e.window.push(k);
    let gas = null, cramps = null; const stool = [];
    e.window.forEach(k => { const d = getDay(k);
      stool.push(!d ? '—' : d.stools.length ? d.stools.map(s => s.b).join('+') : d.noBM ? 'none' : '—');
      if (d && d.sym.gas != null) gas = Math.max(gas ?? 0, d.sym.gas);
      if (d && d.sym.cramps != null) cramps = Math.max(cramps ?? 0, d.sym.cramps); });
    e.stool = stool; e.gas = gas; e.cramps = cramps;
    return e;
  }).sort((a, b) => b.first.localeCompare(a.first) || a.name.localeCompare(b.name));
}
function amountOn(d, key){
  let amt = 0, any = false, unit = 'g';
  MEALS.forEach(([m]) => d.meals[m].items.forEach(i => { if (lc(i.name) === key){ any = true; amt += Number(i.g) || 0; } }));
  d.drinks.forEach(x => { if (lc(x.name) === key){ any = true; unit = 'ml'; amt += Number(x.ml) || 0; } });
  return any ? (amt ? amt + ' ' + unit : '✓') : '';
}
function mealChips(d, m){
  const freq = {}, hist = [];
  Object.keys(S.days).sort().reverse().forEach(k => { const x = S.days[k]; if (!hasData(x)) return;
    uniqCI(x.meals[m].items.map(i => i.name)).forEach(n => { const key = lc(n); if (!freq[key]){ freq[key] = 0; hist.push(n); } freq[key]++; }); });
  const inMeal = new Set(d.meals[m].items.map(i => lc(i.name)));
  return uniqCI([...hist, ...quickFoods(d)]).map((n, i) => ({n, i, f: freq[lc(n)] || 0}))
    .sort((a, b) => b.f - a.f || a.i - b.i).map(x => x.n).filter(n => !inMeal.has(lc(n)));
}
function prevMealDay(date, m){
  return Object.keys(S.days).filter(k => k < date && hasData(S.days[k]) && S.days[k].meals[m].items.length).sort().pop() || null;
}
function drinkChips(d){
  const freq = {}, hist = [];
  Object.keys(S.days).sort().reverse().forEach(k => { const x = S.days[k]; if (!hasData(x)) return;
    uniqCI(x.drinks.map(z => z.name)).forEach(n => { const key = lc(n); if (!freq[key]){ freq[key] = 0; hist.push(n); } freq[key]++; }); });
  return uniqCI([...hist, ...S.quickDrinks]).map((n, i) => ({n, i, f: freq[lc(n)] || 0})).sort((a, b) => b.f - a.f || a.i - b.i).map(x => x.n);
}
/* Every food name the app knows (any meal, quick list, base, test list): used to reuse an existing name instead of creating a near-duplicate. */
function knownFoods(){
  const all = [...S.safeFoods, ...S.quickFoods, ...S.tests.map(t => t.name)];
  Object.values(S.days).forEach(x => { if (hasData(x)) MEALS.forEach(([m]) => x.meals[m].items.forEach(i => all.push(i.name))); });
  return uniqCI(all);
}
function knownDrinks(){
  const all = [...S.quickDrinks];
  Object.values(S.days).forEach(x => { if (hasData(x)) x.drinks.forEach(z => all.push(z.name)); });
  return uniqCI(all);
}
const TOP_CHIPS = 8;
function chipBox(id, names, act, labelFn, showAll, moreAct, searchOnly=[]){
  const hid = new Set(C.hiddenChips.map(lc)), inList = new Set(names.map(lc));
  let rank = 0;
  const all = [...names, ...searchOnly.filter(n => !inList.has(lc(n)))];   // searchOnly: known foods that only appear when typed
  const chips = all.map((n, i) => { const h = i >= names.length || hid.has(lc(n)), r = h ? 999 : rank++, vis = !h && (showAll || r < TOP_CHIPS);
    return `<button class="chip" data-act="${act}" data-name="${esc(n)}" data-rank="${r}" data-hidden="${h ? 1 : 0}"${vis ? '' : ' style="display:none"'}>${labelFn(n)}</button>`; }).join('');
  const more = rank > TOP_CHIPS ? `<button class="chip add more" data-act="${moreAct}">${showAll ? 'Show fewer' : 'All (' + rank + ')'}</button>` : '';
  return `<div class="chips" id="${id}">${chips}${more}<span class="nomatch muted small" style="display:none;align-self:center">No match: tap “Add new”.</span></div>`;
}
/* Live filter while typing: matches anywhere in the name, also finds hidden suggestions. */
function filterChips(inputId){
  const box = $(inputId === 'customFood' ? '#foodChips' : '#drinkChips'), inp = $('#' + inputId), btn = $('#' + inputId + 'Btn');
  if (!box || !inp) return;
  const q = lc(inp.value), showAll = inputId === 'customFood' ? ui.allFoods : ui.allDrinks;
  const known = inputId === 'customFood' ? knownFoods() : knownDrinks();
  let shown = 0;
  box.querySelectorAll('.chip[data-name]').forEach(c => { const n = lc(c.dataset.name);
    const vis = q ? n.includes(q) : c.dataset.hidden !== '1' && (showAll || +c.dataset.rank < TOP_CHIPS);
    c.style.display = vis ? '' : 'none'; if (vis) shown++; });
  const more = box.querySelector('.more'); if (more) more.style.display = q ? 'none' : '';
  box.querySelector('.nomatch').style.display = q && !shown ? '' : 'none';
  if (btn) btn.textContent = q && !known.some(f => lc(f) === q) ? 'Add new' : 'Add';
}
function hideChip(name){
  if (!confirm(`Hide “${name}” from suggestions?\n\nYou can still find it by typing, and unhide it on the Tests page.`)) return;
  if (!C.hiddenChips.some(x => lc(x) === lc(name))) C.hiddenChips.push(name);
  saveCfg(); render();
}
const serving = name => C.lastMl[lc(name)] ?? (/espresso/i.test(name) ? 30 : /coffee|caff/i.test(name) ? 150 : 250);
function dayScore(d){
  const vals = SYMPTOMS.map(([k]) => d.sym[k]).filter(v => v != null);
  d.stools.forEach(s => vals.push(BRISTOL_SCORE[s.b] ?? 0));
  return vals.length ? Math.max(...vals) : null;
}
const level = sc => sc == null ? 'log' : sc <= 1 ? 'ok' : sc <= 3 ? 'warn' : 'bad';
function bristolStreak(){
  let date = today(), n = 0;
  const t = getDay(date);
  if (!t || (!t.stools.length && !t.noBM)) date = addDays(date, -1);
  for (let i = 0; i < 60; i++, date = addDays(date, -1)){
    const d = getDay(date);
    if (!d) break;
    if (d.stools.length){ if (d.stools.every(s => s.b === 3 || s.b === 4)) n++; else break; }
    else if (!d.noBM) break;
  }
  return n;
}
const backupTs = () => Math.max(C.lastSyncAt || 0, C.lastFileBackupAt || 0);
const ghReady = () => !!(C.gh.token && /^[\w.-]+\/[\w.-]+$/.test(C.gh.repo) && C.gh.path);
const loggedDayCount = () => Object.values(S.days).filter(d => hasData(d) && d.updatedAt > 1).length;

/* ---------- toast / pill ---------- */
let toastTimer = null;
function toast(msg, err=false){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast' + (err ? ' err' : ''); }, err ? 4200 : 1800);
}
let pillFlash = null;
function flashSaved(){
  const p = $('#pill'); p.textContent = 'Saved ✓'; p.className = 'pill saved';
  clearTimeout(pillFlash); pillFlash = setTimeout(() => { pillFlash = null; updatePill(); }, 1100);
}
function updatePill(){
  if (pillFlash) return;
  const p = $('#pill'); let txt, cls;
  if (ghReady()){
    if (ui.sync === 'syncing'){ txt = 'Backing up…'; cls = ''; }
    else if (ui.sync === 'error'){ txt = 'Backup failed'; cls = 'bad'; }
    else if (C.dirty){ txt = navigator.onLine ? 'Backup pending' : 'Offline · pending'; cls = 'warn'; }
    else { txt = 'Backed up ' + ago(C.lastSyncAt); cls = 'ok'; }
  } else {
    const ts = backupTs();
    txt = ts ? 'Backup ' + ago(ts) : 'Not backed up';
    cls = (!ts || Date.now() - ts > BACKUP_WARN_DAYS*864e5) ? 'warn' : 'ok';
  }
  p.textContent = txt; p.className = 'pill ' + cls;
}

function render(){
  const views = {today:renderToday, tests:renderTests, history:renderHistory, export:renderExport};
  $('#view').innerHTML = views[ui.tab]();
  $('#view').dataset.ok = '1';
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'));

}
const chip = (label, act, attrs='', sel=false, extra='') => `<button class="chip${sel?' sel':''}${extra}" data-act="${act}" ${attrs}>${label}</button>`;
const scale = (act, key, val, sev=true) => `<div class="scale${sev?' sev':''}">${[0,1,2,3,4,5].map(v =>
  `<button class="v${v}${val===v?' sel':''}" data-act="${act}" data-k="${key}" data-v="${v}" aria-label="${v}">${v}</button>`).join('')}</div>`;

function banners(onExport=false){
  let h = '';
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (isIOS && !standalone && !C.hideInstall)
    h += `<div class="banner info"><span>Install: tap <b>Share → Add to Home Screen</b>, then only log from the icon. Safari tabs keep separate data.</span><button class="btn" data-act="hide-install">OK</button></div>`;
  if (onExport) return h;
  if (ui.upd.state === 'available')
    h += `<div class="banner info"><span>Version <b>${esc(ui.upd.latest)}</b> is available (you have ${APP_VERSION}).</span><button class="btn primary" data-act="upd-apply">Update</button></div>`;
  else if (ui.upd.state === 'ready')
    h += `<div class="banner info"><span>A new version is ready.</span><button class="btn primary" data-act="upd-reload">Reload</button></div>`;
  if (ui.sync === 'error')
    h +=`<div class="banner warn"><span>Automatic backup failed: ${esc(ui.syncErr)}</span><button class="btn" data-act="tab" data-tab="export">Fix</button></div>`;
  else if (!ghReady()){
    const ts = backupTs();
    if (loggedDayCount() > 0 && (!ts || Date.now() - ts > BACKUP_WARN_DAYS*864e5))
      h += `<div class="banner warn"><span>${ts ? 'Last backup ' + ago(ts) + '.' : 'No backup yet.'} Set up auto-backup or save a file.</span><button class="btn" data-act="tab" data-tab="export">Back up</button></div>`;
  }
  return h;
}

const plannedTests = () => { const eaten = new Set(reintroFoods().map(e => e.key)); return S.tests.filter(t => !eaten.has(lc(t.name)) && !isSafe(t.name)); };

/* ---------- updates ---------- */
/* Reads APP_VERSION from the live index.html (bypassing every cache) and compares it with the running one. */
async function checkUpdate(quiet=false){
  if (!/^https?:$/.test(location.protocol) || ui.upd.state === 'updating' || ui.upd.state === 'ready') return;
  if (!quiet){ ui.upd = {state:'checking'}; if (ui.tab === 'export') render(); }
  try {
    const html = await (await fetch('./index.html?check=' + Date.now(), {cache:'no-store'})).text();
    const m = html.match(/const APP_VERSION = '([\d.]+)'/);
    if (!m) throw new Error('no version');
    ui.upd = {state: cmpVer(m[1], APP_VERSION) > 0 ? 'available' : 'current', latest: m[1], at: Date.now()};
  } catch(e){ ui.upd = {state: quiet ? 'idle' : 'offline'}; }
  if (!isTyping()) render();
}
/* Drop the saved app copy and reload: the page comes fresh from the network and installs the new offline copy. */
async function applyUpdate(){
  ui.upd = {state:'updating', latest: ui.upd.latest}; render();
  persistNow(); saveCfg();
  try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); } catch(e){}
  try { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); } catch(e){}
  location.reload();
}

/* ---------- export builders ---------- */
function daysInRange(from, to){ return Object.keys(S.days).filter(k => k >= from && k <= to && hasData(S.days[k])).sort().map(k => S.days[k]); }
const cell = s => String(s ?? '').replace(/\|/g, '/').replace(/\s*\n\s*/g, '; ').trim() || '—';
const itemsStr = items => items.filter(i => i.name).map(i => i.name + (i.g ? ` ${i.g} g` : '')).join(', ');
const drinksStr = d => d.drinks.map(x => x.name + (x.ml ? ` ${x.ml} ml` : '')).join(', ');
const bmStr = d => d.stools.length ? String(d.stools.length) : d.noBM ? '0' : '—';
const bristolStr = d => d.stools.length ? d.stools.map(s => s.b).join(', ') : d.noBM ? 'none' : '—';
const testStr = d => d.test.food ? d.test.food + (d.test.phase ? ' — ' + (PHASE_LONG[d.test.phase] || d.test.phase) : '') : '—';
function symStr(d, min){
  const rec = SYMPTOMS.filter(([k]) => d.sym[k] != null);
  if (!rec.length) return 'not recorded';
  const hits = rec.filter(([k]) => d.sym[k] >= min).map(([k, l]) => `${l.toLowerCase()} ${d.sym[k]}`);
  return hits.length ? hits.join(', ') : (min <= 1 ? 'all 0' : 'none');
}
function buildMarkdown(from, to){
  const days = daysInRange(from, to), fs = firstSeenMap(), L = [];
  L.push('# Food reintroduction diary', '');
  L.push(`Period: ${from} to ${to} (${days.length} logged day${days.length===1?'':'s'}). Generated ${today()}.`, '');
  L.push('Scales: symptoms 0–5 (0 = none, 5 = severe). Bristol stool scale 1–7 (3–4 = normal, 5–7 = loose, 1–2 = hard). Sleep 0–5 (5 = great), stress 0–5 (5 = high). "—" = not recorded.', '');
  L.push('Method: elimination diet, then reintroducing foods. Any food or drink (except water) not in the base diet counts as being reintroduced; it is detected automatically from the meals logged, there is no separate test marker.', '');
  L.push('## Base (safe) diet', '', S.safeFoods.join(', ') || '—', '');
  const foods = reintroFoods().filter(e => e.days.some(k => k >= from && k <= to) || e.window.some(k => k >= from && k <= to));
  L.push('## Foods being reintroduced', '', 'Window = first day eaten until 2 days after the last day eaten. Stool = Bristol scores per day in that window ("none" = no BM, "—" = not recorded).', '');
  if (foods.length){
    L.push('| Food | First eaten | Days eaten | Amounts | Stool in window | Max gas | Max cramps | Verdict / note |', '|---|---|---|---|---|---|---|---|');
    foods.slice().reverse().forEach(e => { const st = e.test && VERDICTS.some(v => v[0] === e.test.status) ? STATUS_LABEL[e.test.status] : 'no verdict yet';
      const amts = e.days.map(k => amountOn(S.days[k], e.key)).join(', ');
      L.push(`| ${cell(e.name)} | ${e.first} | ${e.days.length} | ${cell(amts)} | ${cell(e.stool.join(' · '))} | ${e.gas ?? '—'} | ${e.cramps ?? '—'} | ${cell(st + (e.test && e.test.note ? ': ' + e.test.note : ''))} |`); });
  } else L.push('_None in this period._');
  const planned = plannedTests();
  L.push('', '## Planned, not tried yet', '', planned.map(t => t.name).join(', ') || '—', '');
  if (!days.length){ L.push('_No days logged in this period._', ''); }
  else {
    L.push('## Overview', '', '| Date | New foods (first time) | BMs | Bristol | Gas | Cramps | Other symptoms ≥ 2 |', '|---|---|---|---|---|---|---|');
    days.forEach(d => { const other = SYMPTOMS.filter(([k]) => !MAIN_SYM.includes(k) && d.sym[k] >= 2).map(([k, l]) => `${l.toLowerCase()} ${d.sym[k]}`).join(', ');
      L.push(`| ${fmtDate(d.date,{weekday:'short'})} ${d.date} | ${cell(newFoodsOn(d, fs).join(', '))} | ${bmStr(d)} | ${bristolStr(d)} | ${d.sym.gas ?? '—'} | ${d.sym.cramps ?? '—'} | ${cell(other)} |`); });
    L.push('', '## Daily details', '');
    days.forEach(d => {
      L.push(`### ${fmtDate(d.date, {weekday:'long', day:'numeric', month:'short', year:'numeric'})} (${d.date})`);
      if (d.test.food) L.push(`- **Marked test food:** ${testStr(d)}`);
      MEALS.forEach(([k, l]) => { const ml = d.meals[k]; if (ml.items.length) L.push(`- **${l}${ml.time ? ' ' + ml.time : ''}:** ${itemsStr(ml.items)}`); });
      if (MEALS.every(([k]) => !d.meals[k].items.length)) L.push('- **Meals:** not recorded');
      L.push(`- **Drinks:** ${drinksStr(d) || 'not recorded'}`);
      L.push(`- **Stool:** ${d.stools.length ? d.stools.length + ' BM — ' + d.stools.map(s => 'Bristol ' + s.b + (s.time ? ' at ' + s.time : '')).join('; ') : d.noBM ? 'no bowel movement' : 'not recorded'}`);
      L.push(`- **Symptoms:** ${symStr(d, 1)}`);
      if (d.otherSym.trim()) L.push(`- **Other symptoms:** ${d.otherSym.trim().replace(/\n+/g, '; ')}`);
      if (d.sleep != null || d.stress != null) L.push(`- **Sleep / stress:** ${d.sleep ?? '—'}/5 · ${d.stress ?? '—'}/5`);
      if (d.meds.trim()) L.push(`- **Medications:** ${d.meds.trim()}`);
      if (d.exercise.trim()) L.push(`- **Exercise:** ${d.exercise.trim()}`);
      const nf = newFoodsOn(d, fs);
      if (nf.length) L.push(`- **First time logged (not in base diet):** ${nf.join(', ')}${nf.length > 1 ? ' ⚠ more than one new item on the same day' : ''}`);
      if (d.notes.trim()) L.push(`- **Notes:** ${d.notes.trim().replace(/\n+/g, '; ')}`);
      L.push('');
    });
  }
  L.push('---', '', 'Please analyze this diary: look for patterns between the foods being reintroduced and stool or symptoms (allowing for 24–72 h delays), point out confounders (e.g. several new foods at once), judge whether each food looks tolerated, and suggest concrete next steps (continue, retest, pause, or what to try next and how).');
  return L.join('\n');
}
function buildCSV(){
  const head = ['date','new_foods', ...MEALS.map(([k]) => k), 'drinks','bm_count','bristol', ...SYMPTOMS.map(([k]) => k),
    'other_symptoms','sleep','stress','medications','exercise','notes'];
  const q = v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const fs = firstSeenMap();
  const rows = daysInRange('0000-00-00', '9999-12-31').map(d => [d.date, newFoodsOn(d, fs).join('; '),
    ...MEALS.map(([k]) => (d.meals[k].time ? d.meals[k].time + ' ' : '') + itemsStr(d.meals[k].items)),
    drinksStr(d), d.stools.length || (d.noBM ? 0 : ''), d.stools.map(s => s.b).join(' '),
    ...SYMPTOMS.map(([k]) => d.sym[k] ?? ''), d.otherSym, d.sleep ?? '', d.stress ?? '', d.meds, d.exercise, d.notes]);
  return '﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n');
}

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  try { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }
}
async function saveFile(name, text, mime){
  const blob = new Blob([text], {type:mime});
  const touch = matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.canShare){
    const file = new File([blob], name, {type:mime});
    if (navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:name}); return true; }
      catch(e){ if (e.name === 'AbortError') return false; }
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}

/* ---------- merge / sync ---------- */
function mergeInto(local, remote){
  let changedAny = false;
  Object.entries(remote.days || {}).forEach(([k, rd]) => {
    const ld = local.days[k];
    if (!ld || (rd.updatedAt || 0) > (ld.updatedAt || 0)){ local.days[k] = normDay(rd, k); changedAny = true; }
  });
  if ((remote.listsUpdatedAt || 0) > (local.listsUpdatedAt || 0)){
    local.tests = remote.tests; local.safeFoods = remote.safeFoods; local.quickFoods = remote.quickFoods;
    local.quickDrinks = remote.quickDrinks; local.listsUpdatedAt = remote.listsUpdatedAt; changedAny = true;
  }
  return changedAny;
}
async function ghFetch(method, path, body){
  return fetch('https://api.github.com' + path, { method, cache:'no-store',
    headers: Object.assign({'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + C.gh.token}, body ? {'Content-Type':'application/json'} : {}),
    body: body ? JSON.stringify(body) : undefined });
}
function ghErr(r){
  if (r.status === 401) return 'Token rejected (wrong or expired).';
  if (r.status === 403) return 'Token lacks permission (needs Contents: Read and write) or rate-limited.';
  if (r.status === 404) return 'Repo not found, or the token has no access to it.';
  return 'GitHub error ' + r.status + '.';
}
const ghFile = () => `/repos/${C.gh.repo}/contents/${C.gh.path.split('/').map(encodeURIComponent).join('/')}`;
async function ghPull(){
  const r = await ghFetch('GET', ghFile());
  if (r.status === 404){
    const rr = await ghFetch('GET', `/repos/${C.gh.repo}`);
    if (!rr.ok) throw new Error(ghErr(rr));
    return {data:null, sha:null};
  }
  if (!r.ok) throw new Error(ghErr(r));
  const j = await r.json();
  let b64 = j.content;
  if (!b64 && j.sha){ const br = await ghFetch('GET', `/repos/${C.gh.repo}/git/blobs/${j.sha}`); if (!br.ok) throw new Error(ghErr(br)); b64 = (await br.json()).content; }
  const txt = b64 ? b64dec(b64) : '';
  return {data: txt.trim() ? JSON.parse(txt) : null, sha:j.sha};
}
async function ghPush(payload, sha){
  const body = {message: 'Backup ' + new Date().toISOString().slice(0,16).replace('T',' '), content: b64enc(JSON.stringify(payload, null, 1))};
  if (sha) body.sha = sha;
  return ghFetch('PUT', ghFile(), body);
}
let syncing = false, syncAgain = false, syncTimer = null;
function scheduleSync(delay=8000){ if (!ghReady() || !C.gh.auto) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, delay); }
function setSync(state, err=''){ ui.sync = state; ui.syncErr = err; updatePill(); if (ui.tab === 'export' && !isTyping()) render(); }
const isTyping = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox'; };
async function sync(){
  clearTimeout(syncTimer);
  if (!ghReady()) return;
  if (syncing){ syncAgain = true; return; }
  if (!navigator.onLine){ updatePill(); return; }
  syncing = true; setSync('syncing');
  try {
    let done = false;
    for (let attempt = 0; attempt < 3 && !done; attempt++){
      const {data, sha} = await ghPull();
      if (data && mergeInto(S, normalize(data))){ persistNow(); if (!isTyping()) render(); }
      const payload = syncPayload();
      if (!data || JSON.stringify(normalize(data)) !== JSON.stringify(normalize(payload))){
        const r = await ghPush(payload, sha);
        if (r.status === 409 || r.status === 422) continue;   // someone else pushed in between: pull + merge again
        if (!r.ok) throw new Error(ghErr(r));
      }
      done = true;
    }
    if (!done) throw new Error('Could not resolve a conflicting backup; try again.');
    C.lastSyncAt = Date.now(); C.dirty = false; saveCfg(); setSync('ok');
  } catch(e){
    setSync('error', e.message || 'Network error.');
  } finally {
    syncing = false;
    if (syncAgain){ syncAgain = false; scheduleSync(1500); }
  }
}
window.addEventListener('online', () => { if (C.dirty) sync(); else updatePill(); });
window.addEventListener('offline', updatePill);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden'){ persistNow(); if (C.dirty && ghReady() && C.gh.auto) sync(); }
  else { if (!ui.upd.at || Date.now() - ui.upd.at > 30*60e3) checkUpdate(true);
    if (ghReady() && (C.dirty || Date.now() - C.lastSyncAt > 5*60e3)) sync(); else updatePill(); if (ui.date !== today() && !getDay(ui.date) && ui.tab === 'today'){ ui.date = today(); render(); } }
});
window.addEventListener('pagehide', persistNow);

/* ---------- actions ---------- */
const A = {
  'tab': el => { ui.tab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  'hide-install': () => { C.hideInstall = true; saveCfg(); render(); },
  'day-shift': el => { const n = +el.dataset.n, nd = addDays(ui.date, n); if (nd > today()) return; ui.date = nd; render(); },
  'day-today': () => { ui.date = today(); ui.meal = defaultMeal(); render(); },
  'day-clear': () => { if (!confirm('Clear everything logged for ' + fmtDate(ui.date) + '?')) return;
    S.days[ui.date] = Object.assign(blankDay(ui.date), {deleted:true, updatedAt:Date.now()}); changed(); toast('Day cleared'); },
  'test-food': el => editDay(d => { d.test.food = el.dataset.name; if (!d.test.food) d.test.phase = ''; }),
  'test-phase': el => editDay(d => { d.test.phase = d.test.phase === el.dataset.v ? '' : el.dataset.v; }),
  'meal-tab': el => { ui.meal = el.dataset.m; render(); },
  'item-add': el => addFood(el.dataset.name),
  'item-add-custom': () => { const typed = cap($('#customFood').value.trim()); if (!typed) return $('#customFood').focus();
    const existing = knownFoods().find(f => lc(f) === lc(typed));            // reuse the existing spelling, no duplicates
    if (!existing){ S.quickFoods.push(typed); S.listsUpdatedAt = Date.now(); }
    addFood(existing || typed); },
  'upd-check': () => checkUpdate(false),
  'upd-apply': () => applyUpdate(),
  'upd-reload': () => { persistNow(); location.reload(); },
  'all-foods': () => { ui.allFoods = !ui.allFoods; render(); },
  'all-drinks': () => { ui.allDrinks = !ui.allDrinks; render(); },
  'unhide': el => { C.hiddenChips = C.hiddenChips.filter(x => lc(x) !== lc(el.dataset.uname)); saveCfg(); render(); },
  'item-del': el => editDay(d => { d.meals[ui.meal].items.splice(+el.dataset.i, 1); }),
  'meal-repeat': el => { const src = S.days[el.dataset.from].meals[ui.meal];
    editDay(d => { const m = d.meals[ui.meal]; m.items = JSON.parse(JSON.stringify(src.items));
      if (!m.time && ui.date === today() && ui.meal !== 'snack') m.time = nowTime(); }); toast('Added, adjust as needed'); },
  'meal-time-clear': () => editDay(d => { d.meals[ui.meal].time = ''; }),
  'more-sym': () => { ui.moreSym = !ui.moreSym; render(); },
  'more-ctx': () => { ui.moreCtx = !ui.moreCtx; render(); },
  'drink-add': el => addDrink(el.dataset.name),
  'drink-add-custom': () => { const typed = cap($('#customDrink').value.trim()); if (!typed) return $('#customDrink').focus();
    const existing = knownDrinks().find(f => lc(f) === lc(typed));
    if (!S.quickDrinks.some(f => lc(f) === lc(typed))){ S.quickDrinks.push(existing || typed); S.listsUpdatedAt = Date.now(); }
    addDrink(existing || typed); },
  'drink-del': el => editDay(d => { d.drinks.splice(+el.dataset.i, 1); }),
  'bm-add': el => { const b = +el.dataset.b; editDay(d => { d.stools.push({b, time: ui.date === today() ? nowTime() : ''}); d.noBM = false; }); toast('BM logged: Bristol ' + b); },
  'bm-del': el => editDay(d => { d.stools.splice(+el.dataset.i, 1); if (!d.stools.length) d.noBM = true; }),
  'nobm': () => editDay(d => { d.noBM = !d.noBM; }),
  'sym': el => editDay(d => { const v = +el.dataset.v; d.sym[el.dataset.k] = d.sym[el.dataset.k] === v ? null : v; }),
  'sym-none': el => editDay(d => { SYMPTOMS.forEach(([k]) => { if (el.dataset.all === '1' || MAIN_SYM.includes(k)) d.sym[k] = 0; }); }),
  'ctx': el => editDay(d => { const v = +el.dataset.v; d[el.dataset.k] = d[el.dataset.k] === v ? null : v; }),
  // tests
  'verdict': el => { const t = ensureTest(el.dataset.key); t.status = t.status === el.dataset.v ? 'untested' : el.dataset.v;
    ui.openTests.add(el.dataset.key); changed({lists:true}); },
  'to-base': el => { const t = ensureTest(el.dataset.key); t.status = 'ok';
    if (!isSafe(t.name)) S.safeFoods.push(t.name); changed({lists:true}); toast(t.name + ' added to base foods'); },
  't-move': el => { const p = plannedTests(), i = p.findIndex(x => x.id === el.dataset.id), j = i + +el.dataset.n;   // swap with the neighbouring *planned* food
    if (i < 0 || j < 0 || j >= p.length) return;
    const a = S.tests.indexOf(p[i]), b = S.tests.indexOf(p[j]); [S.tests[a], S.tests[b]] = [S.tests[b], S.tests[a]]; changed({lists:true}); },
  't-del': el => { const t = S.tests.find(x => x.id === el.dataset.id); if (!confirm('Remove ' + t.name + ' from the test list?')) return;
    S.tests = S.tests.filter(x => x !== t); changed({lists:true}); },
  't-add': () => { const v = cap($('#newTest').value.trim()); if (!v) return $('#newTest').focus();
    if (S.tests.some(t => lc(t.name) === lc(v))) return toast('Already in the list');
    S.tests.push({id:uid(), name:v, status:'untested', start:'', end:'', note:''}); changed({lists:true}); },
  'list-add': el => { const k = el.dataset.kind, inp = $('#add-' + k), v = cap(inp.value.trim()); if (!v) return inp.focus();
    if (S[k].some(f => lc(f) === lc(v))) return toast('Already in the list');
    S[k].push(v); changed({lists:true}); },
  'list-del': el => { const k = el.dataset.kind; S[k].splice(+el.dataset.i, 1); changed({lists:true}); },
  // history
  'h-month': el => { const [y, m] = ui.histMonth.split('-').map(Number); const d = new Date(y, m-1 + +el.dataset.n, 1);
    ui.histMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; render(); },
  'h-open': el => { ui.date = el.dataset.date; ui.tab = 'today'; render(); window.scrollTo(0, 0); },
  // export
  'ex-range': el => { const n = el.dataset.n; ui.exTo = today();
    ui.exFrom = n === 'all' ? (Object.keys(S.days).filter(k => hasData(S.days[k])).sort()[0] || today()) : addDays(today(), -(+n - 1)); render(); },
  'md-copy': async () => { const ok = await copyText(buildMarkdown(ui.exFrom, ui.exTo)); toast(ok ? 'Copied. Paste it into your AI chat.' : 'Copy failed. Use Share or Preview.', !ok); },
  'md-share': async () => { try { await navigator.share({title:'Food diary ' + ui.exFrom + ' to ' + ui.exTo, text:buildMarkdown(ui.exFrom, ui.exTo)}); } catch(e){} },
  'md-preview': () => { ui.preview = !ui.preview; render(); },
  'csv': async () => { await saveFile(`reintro-${today()}.csv`, buildCSV(), 'text/csv'); },
  'json-backup': async () => {
    const ok = await saveFile(`reintro-backup-${today()}.json`, JSON.stringify(Object.assign(syncPayload(), {exportedAt:new Date().toISOString()}), null, 1), 'application/json');
    if (ok){ C.lastFileBackupAt = Date.now(); saveCfg(); render(); toast('Backup file created'); } },
  'import': () => $('#importFile').click(),
  'import-cancel': () => { ui.pendingImport = null; render(); },
  'import-merge': () => { mergeInto(S, ui.pendingImport); ui.pendingImport = null; changed(); toast('Backup merged'); },
  'import-replace': () => { if (!confirm('Replace ALL data on this device with the file? This cannot be undone.')) return;
    S = ui.pendingImport; ui.pendingImport = null; changed({lists:true}); toast('Data restored from file'); },
  'gh-sync': () => sync(),
  'gh-restore': async () => {
    if (!confirm('Replace ALL data on this device with the GitHub backup? (Use “Back up now” instead to merge.)')) return;
    try { setSync('syncing'); const {data} = await ghPull();
      if (!data){ setSync('idle'); return toast('No backup file in the repo yet', true); }
      S = normalize(data); C.dirty = false; C.lastSyncAt = Date.now(); persistNow(); setSync('ok'); render(); toast('Restored from GitHub ✓');
    } catch(e){ setSync('error', e.message); }
  },
};
function addFood(name){
  editDay(d => { const m = d.meals[ui.meal]; m.items.push({name, g: C.lastGrams[lc(name)] ?? null});
    if (!m.time && ui.date === today() && ui.meal !== 'snack') m.time = nowTime(); });
}
function addDrink(name){
  const s = serving(name);
  editDay(d => { const x = d.drinks.find(z => lc(z.name) === lc(name)); if (x) x.ml = (x.ml || 0) + s; else d.drinks.push({name, ml:s}); });
}
/* Verdicts live in the existing tests list (old app versions keep it intact when syncing). */
function ensureTest(key){
  let t = testFor(key);
  if (!t){ const e = reintroFoods().find(x => x.key === key);
    t = {id:uid(), name: e ? e.name : cap(key), status:'untested', start: e ? e.first : '', end:'', note:''}; S.tests.push(t); }
  return t;
}
const CH = {
  'day-set': el => { if (!el.value) return; ui.date = el.value > today() ? today() : el.value; render(); },
  't-status': el => { const t = S.tests.find(x => x.id === el.dataset.id); t.status = el.value;
    if (t.status === 'progress' && !t.start) t.start = today();
    if (['ok','reaction','retest'].includes(t.status) && t.start && !t.end) t.end = today();
    ui.openTests.add(t.id); changed({lists:true}); },
  'ex-from': el => { if (el.value){ ui.exFrom = el.value; render(); } },
  'ex-to': el => { if (el.value){ ui.exTo = el.value; render(); } },
};
document.addEventListener('click', e => { if (e.target.matches('.datepick input') && e.target.showPicker){ try { e.target.showPicker(); } catch(_){} } });
/* Long-press (~0.6 s) on a food/drink suggestion hides it. */
let lpTimer = null, lpFired = false;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.chip[data-name]'); if (!c) return;
  lpFired = false; clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { lpFired = true; hideChip(c.dataset.name); }, 600);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, () => clearTimeout(lpTimer), true));
document.addEventListener('scroll', () => clearTimeout(lpTimer), true);
document.addEventListener('contextmenu', e => { if (e.target.closest('.chip[data-name]')) e.preventDefault(); });
document.addEventListener('click', e => { if (lpFired){ lpFired = false; return; }
  const el = e.target.closest('[data-act]'); if (el && !el.disabled && A[el.dataset.act]) A[el.dataset.act](el, e); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset.change && CH[el.dataset.change]) CH[el.dataset.change](el);
  if (el.dataset.cfg && el.type === 'checkbox'){ setPath(C, el.dataset.cfg, el.checked); saveCfg(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'customFood' || el.id === 'customDrink') return filterChips(el.id);
  if (el.dataset.bind){
    let v = el.value; if ('num' in el.dataset) v = v === '' ? null : Math.max(0, Number(v));
    editDay(d => {
      setPath(d, el.dataset.bind, v);
      const m = el.dataset.bind.match(/^meals\.(\w+)\.items\.(\d+)\.g$/);
      if (m){ const it = d.meals[m[1]].items[+m[2]]; if (it) C.lastGrams[lc(it.name)] = v; }
      const dm = el.dataset.bind.match(/^drinks\.(\d+)\.ml$/);   // an edited amount becomes that drink's serving size
      if (dm && v){ const x = d.drinks[+dm[1]]; if (x) C.lastMl[lc(x.name)] = v; }
    }, {rerender:false});
  } else if (el.dataset.cfg && el.type !== 'checkbox'){
    setPath(C, el.dataset.cfg, el.value.trim()); if (ui.sync === 'error') ui.sync = 'idle'; saveCfg(); updatePill();
    const ok = ghReady(); document.querySelectorAll('[data-act="gh-sync"],[data-act="gh-restore"]').forEach(b => b.disabled = !ok);
  } else if (el.dataset.tbind){
    const t = S.tests.find(x => x.id === el.dataset.id); if (t){ t[el.dataset.tbind] = el.value; changed({rerender:false, lists:true}); }
  } else if (el.dataset.vnote){
    const t = ensureTest(el.dataset.vnote); t.note = el.value; changed({rerender:false, lists:true});
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  const map = {customFood:'item-add-custom', customDrink:'drink-add-custom', newTest:'t-add'};
  const act = map[e.target.id] || (e.target.id.startsWith('add-') ? 'list-add' : null);
  if (!act) return;
  e.preventDefault();
  A[act](e.target.nextElementSibling || e.target);
});
document.addEventListener('toggle', e => { const el = e.target; if (el.classList && el.classList.contains('test')){ el.open ? ui.openTests.add(el.dataset.id) : ui.openTests.delete(el.dataset.id); } }, true);
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const data = JSON.parse(await f.text()); if (!data || !data.days) throw new Error('not a Reintro backup');
    ui.pendingImport = normalize(data); render(); }
  catch(err){ toast('Could not read file: ' + err.message, true); }
});

/* ---------- boot ---------- */
render();
setInterval(updatePill, 60e3);
if (ghReady()) sync();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  const hadController = !!navigator.serviceWorker.controller;
  // A new offline copy took over while this (older) page is open: offer a reload.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && ui.upd.state !== 'updating'){ ui.upd = {state:'ready'}; if (!isTyping()) render(); } });
  navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).catch(() => {});
  checkUpdate(true);
}
</script>
